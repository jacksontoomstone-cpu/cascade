<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cascade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: an 8-bit arcade screen that fills the window. Password across the top of the board, clue and keys beside it on
   wide screens, stacked on phones. One glowing ice-blue that gets darker down the board; cracking the password turns it all to fire. */
:root {
  --hue: 198;
  --a: hsl(var(--hue) 95% 66%);
  --ad: hsl(var(--hue) 85% 34%);
  --cab: hsl(var(--hue) 60% 7%);
  --screen: hsl(var(--hue) 70% 4%);
  --bezel: hsl(var(--hue) 45% 22%);
  --bezel-l: hsl(var(--hue) 45% 36%);
  --bezel-d: hsl(var(--hue) 50% 12%);
  --rod: hsl(var(--hue) 60% 16%);
  --white: #f2f7f8;
  --muted: hsl(var(--hue) 20% 68%);
  --bad: #ff6a5a;
  --scrim: rgba(3,8,12,.8);
  --pixel: "Press Start 2P", "Courier New", monospace;
  --term: "VT323", "Courier New", monospace;
  color-scheme: dark;
}
:root[data-heat="1"], :root[data-heat="2"] { --hue: 14; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { color: var(--white); font-family: var(--term); font-size: 20px; overflow: hidden;
  background: radial-gradient(70% 60% at 50% 40%, hsl(var(--hue) 70% 14%), transparent 75%), var(--cab); transition: background .4s; }
/* fire vignette: the edges of the window glow once the password is cracked */
body::after { content: ""; position: fixed; inset: 0; z-index: 14; pointer-events: none; opacity: 0; transition: opacity .4s;
  box-shadow: inset 0 0 70px 10px hsl(16 100% 52%); }
:root[data-heat="1"] body::after { opacity: .4; }
:root[data-heat="2"] body::after { opacity: .55; animation: flicker 1.4s ease-in-out infinite; }
@keyframes flicker { 50% { opacity: .4; } }
:root[data-heat="1"] :is(header, .clue, .pw, .ctrl), :root[data-heat="2"] :is(header, .clue, .pw, .ctrl) { background: rgba(14,4,0,.72); box-shadow: 0 0 0 6px rgba(14,4,0,.72); }
:root[data-heat="1"] .clue .whole, :root[data-heat="2"] .clue .whole { color: var(--white); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#fx2 { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 16; pointer-events: none; }
/* the password blast: one white-hot flash over the whole window */
body::before { content: ""; position: fixed; inset: 0; z-index: 17; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 30%, #fff, hsl(20 100% 58%) 55%, hsl(4 100% 40%)); }
body.blast::before { animation: blastflash .7s ease-out; }
@keyframes blastflash { 0% { opacity: .45; } 100% { opacity: 0; } }
button { font-family: inherit; color: inherit; }
button:focus-visible { outline: 3px dashed var(--a); outline-offset: 2px; }

.app {
  position: relative; z-index: 1; height: 100%; max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 10px;
}

header { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 10px 13px; position: relative; }
header::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, hsl(var(--hue) 95% 72%) 25%, hsl(var(--hue) 90% 56%) 25% 50%, hsl(var(--hue) 85% 42%) 50% 75%, hsl(var(--hue) 80% 28%) 75%); }
header h1 { font-family: var(--pixel); font-weight: 400; font-size: 1rem; margin: 0; text-transform: uppercase; color: var(--a); text-shadow: 3px 3px 0 var(--ad); }
.nav { display: flex; align-items: center; white-space: nowrap; font-family: var(--pixel); font-size: .5rem; text-transform: uppercase; }
.nav button { border: none; background: transparent; font-size: .8rem; font-family: var(--pixel); cursor: pointer; padding: 4px 5px; color: var(--a); }
.nav button:disabled { opacity: .25; cursor: default; }
.icons { display: flex; gap: 6px; }
.pay-price { font-family: var(--pixel); font-size: 1.6rem; color: var(--a); text-align: center; margin: 4px 0 0; text-shadow: 3px 3px 0 var(--ad); }
.pay-note { margin: 0; text-align: center; font-size: 1.05rem; line-height: 1.3; }
.pay-small { margin: 0; text-align: center; font-size: .85rem; opacity: .7; }
.icon-btn { border: none; background: var(--bezel); box-shadow: inset -2px -2px 0 var(--bezel-d), inset 2px 2px 0 var(--bezel-l); border-radius: 0; width: 32px; height: 32px; cursor: pointer; display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: square; stroke-linejoin: miter; }
.timer { font-family: var(--pixel); font-size: .8rem; color: var(--a); min-width: 3.4em; text-align: right; font-variant-numeric: tabular-nums; }

main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }

/* every word's brightness comes from --l, set from its height on the board */
.heat { --k: hsl(var(--hue) 92% var(--l, 60%)); --kd: hsl(var(--hue) 85% calc(var(--l, 60%) * .6)); --ks: hsl(var(--hue) 70% calc(var(--l, 60%) * .24)); --kl: hsl(var(--hue) 96% calc(var(--l, 60%) * 1.22)); }

.clue { flex: none; position: relative; min-height: 66px; padding-left: 60px; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.clue .eyebrow { font-family: var(--pixel); font-size: .46rem; line-height: 1.5; text-transform: uppercase; color: var(--muted); }
.clue .eyebrow b { font-weight: 400; color: var(--white); }
.swatch {
  position: absolute; left: 0; top: 6px; width: 50px; height: 50px; font-style: normal; background: var(--k); color: var(--on, #04121a);
  box-shadow: inset -4px -4px 0 var(--kd), inset 4px 4px 0 rgba(255,255,255,.45), 0 0 14px -2px var(--k);
  font-family: var(--pixel); font-size: .8rem; display: grid; place-items: center;
}
.clue .text { font-size: 1.5rem; line-height: .95; text-wrap: balance; }
.clue .whole { font-size: 1.15rem; line-height: 1; color: var(--a); }

.play { flex: none; display: flex; flex-direction: column; gap: 8px; }
.boardwrap {
  --c: 14; --r: 11; --gap: 2px; --rg: 4px;
  --t: max(16px, min(36px, calc((min(100vw, 560px) - 88px - (var(--c) - 1) * var(--gap)) / (var(--c) + 1))));
  --h: max(18px, min(calc(var(--t) * 1.3), calc((100dvh - 500px) / var(--r) - var(--rg))));
  display: flex; justify-content: center; align-items: flex-start; gap: 6px;
}
/* the side word sits in its own little screen, set apart from the board */
.sidebox { flex: none; margin-block: 7px; padding: 7px 3px; background: var(--screen); border-radius: 4px; box-shadow: 0 0 0 3px var(--bezel), 0 0 16px 3px hsl(var(--hue) 95% 50% / .3); }
.sidegrid { display: grid; grid-template-columns: var(--t); grid-template-rows: repeat(var(--r), var(--h)); gap: var(--rg); }
.board {
  flex: none; position: relative; overflow: hidden; margin: 7px; background: var(--screen); border-radius: 6px;
  box-shadow: 0 0 0 5px var(--bezel), 0 0 0 7px var(--bezel-d), 0 0 26px 8px hsl(var(--hue) 95% 50% / .35);
  transition: box-shadow .3s;
}
:root[data-heat="1"] .board, :root[data-heat="2"] .board { box-shadow: 0 0 0 5px var(--bezel), 0 0 0 7px var(--bezel-d), 0 0 46px 16px hsl(14 100% 50% / .7); }
/* behind the tiles: a slow pulse of light rising from below, and a faint receding grid */
.board::before {
  content: ""; position: absolute; inset: 0; animation: breathe 5s ease-in-out infinite;
  background:
    radial-gradient(90% 75% at 50% 112%, hsl(var(--hue) 95% 50% / .6), transparent 70%),
    radial-gradient(50% 45% at 50% 0%, hsl(var(--hue) 95% 60% / .22), transparent 75%),
    repeating-linear-gradient(0deg, hsl(var(--hue) 80% 55% / .1) 0 1px, transparent 1px calc(var(--h) + var(--rg)));
}
@keyframes breathe { 50% { opacity: .6; } }
:root[data-heat="1"] .board::before, :root[data-heat="2"] .board::before { animation-duration: .9s; }
/* scanlines over everything on the screen */
.board::after { content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.24) 0 1px, transparent 1px 3px); }
.grid {
  position: relative; display: grid; grid-template-columns: repeat(var(--c), var(--t)); grid-template-rows: repeat(var(--r), var(--h)); gap: var(--rg) var(--gap); padding: 7px 6px;
  background: linear-gradient(90deg, transparent calc(50% - 1px), var(--rod) calc(50% - 1px), var(--rod) calc(50% + 1px), transparent calc(50% + 1px)) calc(6px - var(--gap) / 2) 0 / calc(var(--t) + var(--gap)) 100% repeat-x;
}
.tile {
  position: relative; border: 2px solid var(--kd); border-radius: 0; padding: 0; color: var(--white); cursor: pointer; user-select: none;
  background: var(--ks); font-family: var(--pixel); font-size: calc(var(--t) * .5); line-height: 1; display: grid; place-items: center;
  transition: background .25s, border-color .25s;
}
/* pixel links join the letters of one word; a break in the links marks the two halves of a compound */
.tile:not(.last)::after { content: ""; position: absolute; left: 100%; top: calc(50% - 3px); width: calc(var(--gap) + 4px); height: 6px; background: var(--kd); }
.tile.active { background: var(--kd); border-color: var(--k); }
.tile.cur { animation: blink 1s steps(2, jump-none) infinite; }
@keyframes blink { 0% { background: var(--white); color: var(--screen); } 100% { background: var(--kd); } }
.tile.locked { border-color: var(--k); background: linear-gradient(180deg, var(--kl), var(--k) 55%, var(--kd)); color: var(--on, #04121a); box-shadow: inset -3px -3px 0 var(--kd), inset 3px 3px 0 rgba(255,255,255,.45), 0 0 10px -1px var(--k); }
.tile.locked.active { border-color: var(--white); }
.tile.revealed { background: var(--screen); color: var(--muted); border-style: dashed; border-color: var(--muted); }
.tile.revealed::after { display: none; }
/* compound words: white outline and a steady glow, so they stand out as the big plays */
.tile.cmp { border-color: var(--white); box-shadow: 0 0 9px 0 hsl(0 0% 100% / .55); }
.tile.cmp::after { background: var(--white); }
.tile.cmp.locked { border-color: var(--white); box-shadow: inset -3px -3px 0 var(--kd), inset 3px 3px 0 rgba(255,255,255,.5), 0 0 13px 1px var(--white); }
/* a solved compound turns properly red, then cools back to the board's color */
@property --hue { syntax: "<number>"; inherits: true; initial-value: 198; }
.tile { transition: background .25s, border-color .25s, --hue 1.7s ease-in; }
.tile.hot { --hue: 0; --l: 54% !important; --on: #fff; transition: none; }
.tile.hot.cmp { border-color: hsl(0 100% 72%); box-shadow: 0 0 16px 3px hsl(0 100% 50%); }
/* a solved word lights up hard for a second */
.tile.lit { z-index: 3; animation: lit 1.05s ease-out both; }
@keyframes lit { 0% { transform: scale(1); filter: brightness(1); } 18% { transform: scale(1.16); filter: brightness(2.3); box-shadow: 0 0 22px 7px var(--k); } 100% { transform: scale(1); filter: brightness(1); } }
/* the password row: a stamped letter reads as pressed into the plate, and the row turns solid once cracked */
.tile.pwt { border-color: var(--bezel-l); background: var(--bezel-d); box-shadow: inset 2px 2px 0 rgba(0,0,0,.55), inset -2px -2px 0 rgba(255,255,255,.08); }
.tile.pwt::after { display: none; }
.tile.pwt.active { background: var(--bezel); border-color: var(--a); }
.tile.pwt.imprint { color: var(--a); border-color: var(--a); background: var(--screen); text-shadow: 0 0 9px var(--a); box-shadow: inset 2px 2px 0 rgba(0,0,0,.7), 0 0 10px -1px var(--a); }
.tile.pwt.locked:not(.imprint) { border-color: var(--white); background: linear-gradient(180deg, var(--kl), var(--k) 55%, var(--kd)); box-shadow: 0 0 12px 1px var(--k); }
.tile.land { animation: land .3s steps(3); }
.tile.wrong { animation: wrong .45s steps(6); }
@keyframes land { 0% { background: var(--white); transform: translateY(-4px); } 100% { transform: none; } }
@keyframes wrong { 0%,100% { transform: none; } 20%,40% { background: var(--bad); color: var(--screen); } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
.faller {
  position: absolute; z-index: 3; display: grid; place-items: center; pointer-events: none;
  background: var(--k); color: var(--on, #04121a); font-family: var(--pixel); font-size: calc(var(--t) * .5); line-height: 1;
  width: var(--t); height: var(--h); box-shadow: inset -3px -3px 0 var(--kd), inset 3px 3px 0 rgba(255,255,255,.7), 0 0 14px 2px var(--k);
}

.colbeam {
  position: absolute; top: 0; bottom: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(180deg, hsl(var(--hue) 96% 72% / .9), hsl(var(--hue) 95% 50% / .35) 60%, transparent);
  box-shadow: 0 0 22px 6px hsl(var(--hue) 95% 55% / .6);
}

.faller.mystery { z-index: 4; animation: mystery .36s steps(2) infinite, mysteryin .25s steps(3); }
@keyframes mystery { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-5px) scale(1.12); } }
@keyframes mysteryin { from { transform: translateY(14px) scale(.3); opacity: 0; } }

.pw-clue { text-align: center; font-size: 1.05rem; line-height: 1; color: var(--muted); }

/* the points bar: one color, dark to bright */
.bar { position: relative; flex: none; height: 26px; background: var(--screen); box-shadow: 0 0 0 2px var(--bezel); overflow: hidden; }
.bar-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, hsl(var(--hue) 85% 24%), hsl(var(--hue) 92% 44%), hsl(var(--hue) 96% 70%)); box-shadow: 0 0 12px hsl(var(--hue) 95% 60%); transition: width .45s steps(10); }
.bar-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding-inline: 8px; font-family: var(--pixel); font-size: .5rem; text-transform: uppercase; text-shadow: 1px 1px 0 var(--screen), -1px -1px 0 var(--screen), 1px -1px 0 var(--screen), -1px 1px 0 var(--screen); }
.bar-text b { font-weight: 400; }

.ctrl { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.status { display: flex; align-items: center; gap: 10px; font-family: var(--pixel); font-size: .5rem; text-transform: uppercase; color: var(--muted); }
.miss-label { display: none; }
.misses { display: flex; gap: 2px; }
.misses i { font-style: normal; font-size: 1.05rem; line-height: 1; color: var(--a); font-family: Arial, sans-serif; }
.misses i::before { content: "♥"; }
.misses i.used { color: var(--rod); }
.link-btn { white-space: nowrap; border: none; background: transparent; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-family: var(--pixel); font-size: .5rem; text-transform: uppercase; padding: 2px 0; color: var(--muted); }

.actions { display: flex; justify-content: center; gap: 8px; }
.btn { border: none; border-radius: 0; background: var(--bezel); box-shadow: inset -3px -3px 0 var(--bezel-d), inset 3px 3px 0 var(--bezel-l); padding: 11px 12px; font-family: var(--pixel); font-size: .56rem; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--a); color: #04121a; box-shadow: inset -3px -3px 0 var(--ad), inset 3px 3px 0 rgba(255,255,255,.5), 0 0 12px -2px var(--a); }
.btn:active { transform: translate(1px, 1px); }
.btn:disabled { opacity: .35; cursor: default; }

.kb { flex: none; display: flex; flex-direction: column; gap: 5px; margin-top: auto; }
.kb .row { display: flex; gap: 4px; justify-content: center; }
.kb button { flex: 1; max-width: 43px; height: 44px; border: none; border-radius: 0; background: var(--bezel); box-shadow: inset -3px -3px 0 var(--bezel-d), inset 3px 3px 0 var(--bezel-l); font-family: var(--pixel); font-size: .72rem; cursor: pointer; text-transform: uppercase; padding: 0; }
.kb button:active { background: var(--a); color: #04121a; }
.kb button.wide { max-width: 66px; flex: 1.5; font-size: .46rem; }
.kb button[aria-label="Delete"] { font-family: Arial, sans-serif; font-size: 1.15rem; }
.kb .spacer { flex: .5; max-width: 20px; }

/* start screen: big title and three rules, over the board */
.sheet.start { align-items: center; text-align: center; gap: 22px; padding: 34px 24px 26px; width: min(100% - 8px, 480px); }
.sheet.start .start-title { font-size: clamp(1.9rem, 8vw, 2.8rem); padding: 0; letter-spacing: .04em; text-shadow: 4px 4px 0 var(--ad), 0 0 18px var(--a); }
.start-rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; font-size: 1.35rem; line-height: 1.1; counter-reset: rule; }
.start-rules li + li::before { content: ""; display: block; width: 36px; height: 2px; margin: 0 auto 14px; background: var(--muted); opacity: .45; }   /* short divider between rules */
.sheet.start .btn { min-width: 60%; }

.toast { position: fixed; left: 50%; bottom: calc(176px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--screen); color: var(--a); border: 3px solid var(--a); padding: 9px 12px; font-family: var(--pixel); font-size: .55rem; text-transform: uppercase; z-index: 30; pointer-events: none; white-space: nowrap; box-shadow: 0 0 16px -2px var(--a); }

.modal { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 20; padding: 16px; }
.sheet { background: var(--screen); border: 4px solid var(--white); outline: 4px solid var(--bezel); width: min(100% - 8px, 450px); padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; position: relative; max-height: calc(100% - 8px); overflow-y: auto; }
.sheet h2 { font-family: var(--pixel); font-weight: 400; font-size: 1rem; line-height: 1.4; margin: 0; padding-right: 24px; text-transform: uppercase; color: var(--a); text-wrap: balance; }
.sheet p { margin: 0; line-height: 1.05; font-size: 1.2rem; }
.sheet ul { margin: 0; padding-left: 1em; line-height: 1.05; font-size: 1.2rem; display: flex; flex-direction: column; gap: 6px; }
.sheet .close { position: absolute; top: 8px; right: 8px; border: none; background: transparent; font-family: var(--pixel); font-size: .9rem; cursor: pointer; width: 36px; height: 36px; }
/* end screen: how much of the board you filled, your time and lives. Nothing that gives answers away */
.res-meter { position: relative; height: 34px; background: var(--screen); box-shadow: 0 0 0 3px var(--bezel), 0 0 0 5px var(--muted); overflow: hidden; margin: 6px 4px 0; }
.res-meter-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--a); box-shadow: 0 0 14px var(--a); transition: width 1.1s steps(20); }
.res-meter span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--pixel); font-size: .8rem; color: var(--white); text-shadow: 2px 2px 0 var(--bezel), -1px -1px 0 var(--bezel); }
.res-stats { display: flex; justify-content: center; gap: 40px; text-align: center; }
.res-stats b { display: block; font-family: var(--pixel); font-weight: 400; font-size: 1.2rem; color: var(--a); }
.res-stats small { display: block; margin-top: 6px; font-size: 1.05rem; color: var(--muted); }

@media (min-width: 420px) { .miss-label { display: inline; } }
@media (max-width: 419px) {
  header { gap: 3px; } header h1 { font-size: .68rem; text-shadow: 2px 2px 0 var(--ad); } .icon-btn { width: 28px; height: 28px; } .timer { font-size: .7rem; } .nav button { padding: 4px 3px; } .icons { gap: 4px; } .timer { min-width: 0; }
  .status { gap: 5px; } .misses { gap: 0; } .misses i { font-size: .72rem; } .ctrl { gap: 6px; } .actions { gap: 5px; } .btn { padding: 10px 8px; font-size: .5rem; }
}
@media (max-height: 720px) { .kb button { height: 36px; } .clue { min-height: 58px; } .clue .text { font-size: 1.45rem; } }

/* phones: clue above the board, everything else below it. The board is sized to fit the space left over (set from JS),
   and pinching or double-tapping zooms in; zoomed, it pans to follow the word you're on, with the side word pinned left. */
@media (max-width: 859px) {
  main { gap: 6px; padding-top: 6px; }
  .play { flex: 1; min-height: 0; gap: 6px; }
  .boardwrap {
    --gap: 2px; --rg: 4px;
    flex: 1; min-height: 0; overflow: auto; justify-content: flex-start; gap: 8px; padding: 7px 4px 7px 9px;
    overscroll-behavior: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y;
  }
  .boardwrap::-webkit-scrollbar { display: none; }
  .sidebox { position: sticky; left: 0; z-index: 6; margin-left: auto; box-shadow: 0 0 0 3px var(--bezel), 0 0 0 9px var(--cab); }
  .boardwrap > .board { margin-right: auto; }
  .boardwrap > .board, .boardwrap > .sidebox { margin-top: auto; margin-bottom: auto; }
  .pw-clue { font-size: 1.15rem; }
  .clue { min-height: 74px; }
  /* no on-screen keys: tapping a word brings up the phone's own keyboard, and the game shrinks to fit above it */
  .kb { display: none; }

        pending.delete(cellKey(r, c)); render();
        const t = tiles[r][c]; t.classList.remove("land"); void t.offsetWidth; t.classList.add("land");
        sfx("tick", n % 5);
      }, T * Math.max(0, top - y0) / dist);
    });
    setTimeout(() => { if (token === idx) settle(); }, T + 350);
  }, HOLD);
}

// A solved word lights up for a moment, letter by letter
function flash(r, cells = litCells, hold = 1150) {
  const token = idx;
  colsOf(r).forEach((c, n) => {
    const k = cellKey(r, c); cells.add(k);
    tiles[r][c].style.animationDelay = n * 35 + "ms";
    setTimeout(() => {
      if (token !== idx) return;
      cells.delete(k); tiles[r][c].style.animationDelay = ""; render();
    }, hold + n * 35);
  });
}

function win() {
  kbIn.blur();
  S.status = "won"; save(); render(); sfx("win");
  setTimeout(showResult, 1400);
}
function lose() {
  kbIn.blur();
  S.status = "lost"; save(); render(); sfx("lose");
  setTimeout(showResult, 1100);
}

let giveUpArmed = null;
function giveUp() {
  if (!playing() || busy) return;
  if (!giveUpArmed) {
    $("giveUpBtn").textContent = "Tap again to give up";
    giveUpArmed = setTimeout(() => { giveUpArmed = null; $("giveUpBtn").textContent = "Give up"; }, 3000);
    return;
  }
  clearTimeout(giveUpArmed); giveUpArmed = null; $("giveUpBtn").textContent = "Give up";
  lose();
}

/* ---------- fire ---------- */
// Cracking the top or side word sets the screen gently on fire for 5 seconds
const fx = $("fx"), fxc = fx.getContext("2d");
const flame = document.createElement("canvas"); flame.width = flame.height = 64;
{ const g = flame.getContext("2d"), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, "rgba(255,190,120,1)"); r.addColorStop(.35, "rgba(255,90,20,.7)"); r.addColorStop(1, "rgba(160,10,0,0)");
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); }
let sparks = [], burning = false, fireUntil = 0, fireTimer;
const FIRE_MS = (CFG.fireSeconds || 5) * 1000;
function setHeat() {
  const lvl = playing() && Date.now() < fireUntil ? 2 : 0;
  document.documentElement.dataset.heat = lvl;
  if (lvl && !burning && !calm()) { burning = true; requestAnimationFrame(burn); }
}
function blast() {
  fireUntil = Date.now() + FIRE_MS;
  clearTimeout(fireTimer); fireTimer = setTimeout(setHeat, FIRE_MS + 50);
  document.body.classList.remove("blast"); void document.body.offsetWidth; document.body.classList.add("blast");
  if (calm()) return;
  const w = innerWidth, h = innerHeight;
  for (let n = 0; n < 110; n++) sparks.push({ x: Math.random() * w, y: h + Math.random() * 60, vx: (Math.random() - .5) * 3, vy: -(4 + Math.random() * 7), r: 24 + Math.random() * 36, life: 1, fade: .014 + Math.random() * .014 });
  setHeat();
}

// A freshly stamped letter gets a little fire of its own
const fx2 = $("fx2"), fy = fx2.getContext("2d");
let licks = [], fires = [], licking = false;
function lick(el) {
  if (calm()) return;
  const a = el.getBoundingClientRect();
  fires.push({ l: a.left, r: a.right, t: a.top, b: a.bottom, end: performance.now() + 1500 });
  if (!licking) { licking = true; requestAnimationFrame(lickLoop); }
}
function lickLoop(now) {
  const w = innerWidth, h = innerHeight;
  if (fx2.width !== w || fx2.height !== h) { fx2.width = w; fx2.height = h; }
  fy.clearRect(0, 0, w, h); fy.globalCompositeOperation = "lighter";
  fires = fires.filter(f => f.end > now);
  fires.forEach(f => {
    for (let n = 0; n < 4; n++) {
      const edge = Math.random() < .75;
      licks.push({ x: edge ? f.l + Math.random() * (f.r - f.l) : Math.random() < .5 ? f.l : f.r, y: edge ? f.b + 2 : f.t + Math.random() * (f.b - f.t),
        vx: (Math.random() - .5) * .8, vy: -(.8 + Math.random() * 1.8), r: 5 + Math.random() * 8, life: 1, fade: .026 + Math.random() * .03 });
    }
  });
  licks = licks.filter(p => p.life > 0);
  licks.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.life -= p.fade;
    const d = p.r * (.4 + p.life * .8);
    fy.globalAlpha = Math.max(0, p.life) * .6;
    fy.drawImage(flame, p.x - d, p.y - d, d * 2, d * 2);
  });
  if (!fires.length && !licks.length) { licking = false; fy.clearRect(0, 0, w, h); return; }
  requestAnimationFrame(lickLoop);
}

function burn() {
  const lvl = +document.documentElement.dataset.heat, w = innerWidth, h = innerHeight;
  if (fx.width !== w || fx.height !== h) { fx.width = w; fx.height = h; }
  fxc.clearRect(0, 0, w, h); fxc.globalCompositeOperation = "lighter";
  for (let n = 0; n < (lvl === 2 ? 6 : lvl ? 3 : 0); n++) {
    const side = false;
    sparks.push({ x: side ? (Math.random() < .5 ? 0 : w) : Math.random() * w, y: side ? Math.random() * h : h + 12,
      vx: (Math.random() - .5) * 1.4, vy: -(1.6 + Math.random() * (lvl === 2 ? 4.4 : 2.4)), r: lvl === 2 ? 12 + Math.random() * 18 : 5 + Math.random() * 9, life: 1, fade: .011 + Math.random() * .016 });
  }
  sparks = sparks.filter(p => p.life > 0);
  sparks.forEach(p => {
    p.x += p.vx + Math.sin(p.y / 26) * .5; p.y += p.vy; p.life -= p.fade;
    const d = p.r * (.45 + p.life * .75);
    fxc.globalAlpha = Math.max(0, p.life) * .32;
    fxc.drawImage(flame, p.x - d, p.y - d, d * 2, d * 2);
  });
  if (!lvl && !sparks.length) { burning = false; fxc.clearRect(0, 0, w, h); return; }
  requestAnimationFrame(burn);
}

/* ---------- timer ---------- */
// counts from your first tap or keypress, and pauses while a window is open or the page is hidden
const clock = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
setInterval(() => {
  if (!S || !playing() || !S.started || document.hidden || anyModal()) return;
  S.time++; $("timer").textContent = clock(S.time);
  if (S.time % 5 === 0) save();
}, 1000);

/* ---------- results ---------- */
// share = exactly what the end screen shows: how full the board got, time, lives left
function filled() {
  if (S.status === "won") return 100;
  let got = 0, all = 0;
  S.locked.forEach(row => row.forEach(l => { all++; if (l) got++; }));
  return Math.min(99, Math.floor(got / all * 100));
}
const livesLeft = () => Math.max(0, LIVES() - S.misses);
function shareText() {
  const n = livesLeft();
  return `Cascade ${idx === INTRO ? "Intro" : `Daily ${dayLabel()}`}\n${filled()}% · ${clock(S.time)} · ${n} ${n === 1 ? "life" : "lives"} left`;
}
function showResult() {
  $("resTitle").textContent = S.status === "lost" ? "Out of lives" : "Board cleared";
  const pct = filled();
  $("resPct").textContent = pct + "%";
  $("resMeter").setAttribute("aria-label", `Board ${pct}% filled`);
  $("resFill").style.width = "0";
  $("resTime").textContent = clock(S.time);
  $("resLives").textContent = `${livesLeft()}/${LIVES()}`;
  const other = playable().find(i => i !== idx && !doneWith(i));
  $("nextBtn").textContent = other === undefined ? "What's next?" : other === INTRO ? "Play the intro" : "Play today's daily";
  $("nextBtn").hidden = other === undefined && !allDone();
  $("resultModal").hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => { $("resFill").style.width = pct + "%"; }));
}

let toastT;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1700);
}

/* ---------- sound ---------- */
let muted = !!store.get("plumb-muted"), ac;
function tone(f, at, dur, type = "sine", vol = .1) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, ac.currentTime + at);
  g.gain.linearRampToValueAtTime(vol, ac.currentTime + at + .01);
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + at + dur);
  o.connect(g).connect(ac.destination); o.start(ac.currentTime + at); o.stop(ac.currentTime + at + dur + .05);
}
function sfx(kind, step = 0) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    if (kind === "good") tone(660, 0, .15);
    if (kind === "tick") tone(520 + step * 120, 0, .1, "triangle", .07);
    if (kind === "bad") tone(170, 0, .22, "square", .05);
    if (kind === "crack") {   // a bright major fanfare: quick climb, then a held chord
      [523, 659, 784, 1047].forEach((f, i) => { tone(f, i * .09, .22, "square", .035); tone(f, i * .09, .3, "triangle", .08); });
      [1047, 1319, 1568].forEach(f => tone(f, .4, 1.1, "triangle", .06));
      tone(523, .4, 1.1, "square", .025);
    }
    if (kind === "win") [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .11, .35, "triangle", .09));
    if (kind === "lose") { tone(330, 0, .3, "triangle", .08); tone(247, .22, .5, "triangle", .08); }
  } catch {}
}
function renderSound() {
  $("soundIcon").innerHTML = muted
    ? '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/>'
    : '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>';
  $("soundBtn").setAttribute("aria-label", muted ? "Sound off" : "Sound on");
}

/* ---------- keyboard ---------- */
function keyBtn(label, cls, fn, aria) {
  const b = document.createElement("button");
  b.textContent = label; if (cls) b.className = cls; if (aria) b.setAttribute("aria-label", aria);
  b.addEventListener("click", () => { fn(); b.blur(); });
  return b;
}
["qwertyuiop", "asdfghjkl", "zxcvbnm"].forEach((r, ri) => {
  const row = document.createElement("div"); row.className = "row";
  const spacer = () => Object.assign(document.createElement("div"), { className: "spacer" });
  if (ri === 1) row.appendChild(spacer());
  if (ri === 2) row.appendChild(keyBtn("Enter", "wide", check));
  [...r].forEach(ch => row.appendChild(keyBtn(ch, "", () => type(ch.toUpperCase()))));
  if (ri === 1) row.appendChild(spacer());
  if (ri === 2) row.appendChild(keyBtn("⌫", "wide", back, "Delete"));
  $("kb").appendChild(row);
});
const anyModal = () => [...document.querySelectorAll(".modal")].some(m => !m.hidden);
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (anyModal()) { if (e.key === "Escape") closeModals(); return; }
  if (e.target === kbIn && e.key !== "Enter") return;   // letters and delete arrive through its input event
  if (/^[a-z]$/i.test(e.key)) { type(e.key.toUpperCase()); e.preventDefault(); }
  else if (e.key === "Backspace") { back(); e.preventDefault(); }
  else if (e.key === "Enter") { check(); e.preventDefault(); }
  else if (e.key === "ArrowLeft") move(-1);
  else if (e.key === "ArrowRight") move(1);
  else if (e.key === "ArrowUp") { moveRow(-1); e.preventDefault(); }
  else if (e.key === "ArrowDown") { moveRow(1); e.preventDefault(); }
});

/* ---------- phone keyboard ----------
   On phones there are no on-screen keys. Tapping a word focuses an invisible text box, so the phone's own keyboard
   comes up. The box always holds one space: a letter arrives as extra text, a delete empties it. */
const kbIn = $("kbIn");
function openKb() {
  if (!phone.matches || !playing()) return;
  if (document.activeElement !== kbIn) kbIn.focus({ preventScroll: true });
}
function resetKb() { kbIn.value = " "; try { kbIn.setSelectionRange(1, 1); } catch {} }
kbIn.addEventListener("input", () => {
  const v = kbIn.value;
  if (v.length < 1) back();
  else [...v.replace(/[^a-z]/gi, "")].forEach(ch => type(ch.toUpperCase()));
  resetKb();
});
kbIn.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check(); } });
kbIn.addEventListener("focus", () => { document.documentElement.classList.add("typing"); resetKb(); setTimeout(keyZoom, 60); });
kbIn.addEventListener("blur", () => { document.documentElement.classList.remove("typing"); setTimeout(keyZoom, 60); });
// while the keyboard is up there's little room, so zoom the board to readable letters and follow the word;
// put the keyboard away and it goes back to the whole board
const READABLE = 26;
function keyZoom() {
  if (!phone.matches) return;
  const typing = document.activeElement === kbIn;
  fit();
  if (typing && baseT * zoom < READABLE) { zoom = READABLE / baseT; autoZoomed = true; fit(); }
  else if (!typing && autoZoomed) { zoom = 1; autoZoomed = false; fit(); }
  lastFollow = ""; if (typing) follow();
}
// keep the keyboard up when tapping Check, Check letter or another word
document.querySelectorAll(".ctrl button, #boardwrap").forEach(el => el.addEventListener("mousedown", e => {
  if (document.activeElement === kbIn) e.preventDefault();
}));
// tapping anywhere else puts the keyboard away
document.addEventListener("pointerdown", e => {
  if (document.activeElement === kbIn && !e.target.closest("#boardwrap, .ctrl")) kbIn.blur();
});
// size the game to the part of the screen the keyboard leaves visible
if (window.visualViewport) {
  const vv = visualViewport, root = document.documentElement;
  const fitVV = () => {
    if (!phone.matches) { root.style.removeProperty("--vvh"); root.style.removeProperty("--vvt"); return; }
    root.style.setProperty("--vvh", vv.height + "px"); root.style.setProperty("--vvt", vv.offsetTop + "px");
    requestAnimationFrame(() => { if (S) keyZoom(); });
  };
  vv.addEventListener("resize", fitVV); vv.addEventListener("scroll", fitVV); fitVV();
}

/* ---------- wiring ---------- */
$("checkBtn").addEventListener("click", check);
$("letterBtn").addEventListener("click", peek);
$("giveUpBtn").addEventListener("click", giveUp);
const step = d => { const list = playable(), j = list.indexOf(idx) + d; if (list[j] !== undefined) load(list[j]); };
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
$("helpBtn").addEventListener("click", () => $("helpModal").hidden = false);
$("soundBtn").addEventListener("click", () => { muted = !muted; store.set("plumb-muted", muted); renderSound(); });
// once the intro and today's daily are both finished, the paywall comes up ($5 once; payment wiring comes later)
function paywall() { if (store.get(PAID)) return false; closeModals(); $("payModal").hidden = false; return true; }
$("nextBtn").addEventListener("click", () => {
  const other = playable().find(i => i !== idx && !doneWith(i));
  if (other !== undefined) { closeModals(); load(other); } else if (!paywall()) closeModals();
});
$("shareBtn").addEventListener("click", () => {
  navigator.clipboard.writeText(shareText()).then(() => toast("Copied")).catch(() => {
    const t = document.createElement("textarea"); t.value = shareText(); document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); toast("Copied"); } catch { toast("Couldn't copy"); }
    t.remove();
  });
});
function closeModals() { document.querySelectorAll(".modal").forEach(m => m.hidden = true); }
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModals));
document.querySelectorAll(".modal").forEach(m => m.addEventListener("click", e => { if (e.target === m) closeModals(); }));
// closing the last result of the day also brings up the paywall
$("resultModal").querySelector(".close").addEventListener("click", () => { if (allDone()) paywall(); });

function start(data) {
  renderSound();
  // new players start on the intro; once it's done they open on today's daily
  load(typeof data.idx === "number" ? data.idx : doneWith(INTRO) && dailyIdx() !== null ? dailyIdx() : INTRO);
  if (allDone() && paywall()) return;
  $("startLives").textContent = LIVES(); $("helpModal").hidden = false;   // start screen every time the game opens
}
window.claude?.hot?.snapshot?.(() => ({ idx }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
